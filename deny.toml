[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # this is a timing attack against using the rsa crate for encryption, but
    # we only use rsa decryption here
    "RUSTSEC-2023-0071",
    # AsyncFd is only used internally by tokio (with file descriptors it owns),
    # and the fixed tokio versions require a second major version of syn
    "RUSTSEC-2026-0386",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = [
    { name = "openssl-sys" },
]
skip = [
    # rsa 0.9 (via num-bigint-dig) still uses rand 0.8
    { name = "rand", version = "0.8.5" },
    { name = "rand", version = "0.9.5" },
    { name = "rand_core", version = "0.6.4" },
    { name = "rand_core", version = "0.9.3" },
    { name = "rand_chacha", version = "0.3.1" },
    { name = "rand_chacha", version = "0.9.0" },
    { name = "getrandom", version = "0.2.16" },
    { name = "getrandom", version = "0.3.4" },
]

[sources]
# only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { name = "ring", allow = ["OpenSSL", "MIT", "ISC"] }
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[[licenses.clarify]]
name = "encoding_rs"
version = "*"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 }
]
