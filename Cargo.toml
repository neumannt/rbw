[package]
name = "rbw"
version = "1.15.0"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.82.0"

description = "Unofficial Bitwarden CLI"
repository = "https://github.com/doy/rbw"
readme = "README.md"
keywords = ["bitwarden"]
categories = ["command-line-utilities", "cryptography"]
license = "MIT"
include = ["src/**/*", "bin/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
aes = "0.8.4"
anyhow = "1.0.100"
argon2 = "0.5.3"
base64 = "0.22.1"
block-padding = "0.3.3"
cbc = { version = "0.1.2", features = ["alloc", "std"] }
clap_complete = "4.5.62"
clap = { version = "4.5.53", features = ["wrap_help", "derive"] }
clap_complete_nushell = "4.5.10"
clap_complete_fig = "4.5.2"
env_logger = "0.11.8"
futures-util = "0.3.31"
hkdf = "0.12.4"
hmac = { version = "0.12.1", features = ["std"] }
# not used directly. this selects the unicode-rs backend for idna (used by
# url) instead of icu4x, which is much larger. see the idna_adapter readme.
idna_adapter = "~1.1"
jiff = { version = "0.2.17", default-features = false, features = ["std"] }
libc = "0.2.178"
log = "0.4.29"
pbkdf2 = "0.12.2"
percent-encoding = "2.3.2"
pkcs8 = "0.10.2"
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
] }
rmpv = "1.3.0"
rsa = { version = "0.9.9", features = ["getrandom"] }
rustix = { version = "1.1.3", features = [
    "mm",
    "param",
    "termios",
    "process",
    "pipe",
    "stdio",
] }
serde_json = "1.0.147"
serde_path_to_error = "0.1.20"
serde_repr = "0.1.20"
serde = { version = "1.0.228", features = ["derive"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
signature = "2.2.0"
ssh-encoding = { version = "0.2.0", features = ["alloc"] }
ssh-key = { version = "0.6.7", default-features = false, features = [
    "alloc",
    "std",
    "ed25519",
    "rsa",
] }
tempfile = "3.24.0"
terminal_size = "0.4.3"
thiserror = "2.0.17"
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-tungstenite = { version = "0.28", features = [
    "rustls-tls-native-roots",
    "url",
] }
tokio = { version = "1.48.0", features = ["full"] }
url = "2.5.7"
zeroize = "1.8.2"

[features]
default = ["clipboard"]
clipboard = []

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
as_conversions = "warn"
get_unwrap = "warn"
cognitive_complexity = "allow"
missing_const_for_fn = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
multiple_crate_versions = "allow"
large_enum_variant = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
struct_field_names = "allow"

[package.metadata.deb]
depends = "pinentry"
recommends = "wl-clipboard | xclip | xsel"
license-file = ["LICENSE"]
assets = [
    [
        "target/release/rbw",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/rbw-agent",
        "usr/bin/",
        "755",
    ],
    [
        "target/release/completion/bash",
        "usr/share/bash-completion/completions/rbw",
        "644",
    ],
    [
        "target/release/completion/zsh",
        "usr/share/zsh/vendor-completions/_rbw",
        "644",
    ],
    [
        "target/release/completion/fish",
        "usr/share/fish/completions/rbw.fish",
        "644",
    ],
    [
        "README.md",
        "usr/share/doc/rbw/README",
        "644",
    ],
]
